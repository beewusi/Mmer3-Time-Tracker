<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- tab icon, same hourglass as the sign in panel -->
  <style>
    .sand { fill: #FBBF24; transform-box: fill-box; transform-origin: bottom center; }
    .top { animation: drain 4.5s linear infinite; }
    .bottom { animation: fill 4.5s linear infinite; }
    .grain { fill: #FBBF24; opacity: 0; transform-box: fill-box; animation: fall 1s linear infinite; }
    .g2 { animation-delay: 0.33s; }
    .g3 { animation-delay: 0.66s; }
    @keyframes drain { 0% { transform: scaleY(0.6); } 92%, 100% { transform: scaleY(0.05); } }
    @keyframes fill { 0% { transform: scaleY(0.4); } 92%, 100% { transform: scaleY(0.95); } }
    @keyframes fall { 0% { transform: translateY(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateY(11px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .top, .bottom, .grain { animation: none; } .top { transform: scaleY(0.6); } .bottom { transform: scaleY(0.4); } }
  </style>
  <defs>
    <clipPath id="topClip"><polygon points="24,12 76,12 51,60 49,60" /></clipPath>
    <clipPath id="bottomClip"><polygon points="49,70 51,70 76,118 24,118" /></clipPath>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0F172A" />
  <g transform="translate(19 10) scale(0.62)">
    <g fill="none" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <line x1="16" y1="10" x2="84" y2="10" />
      <line x1="16" y1="120" x2="84" y2="120" />
      <path d="M22 10c0 34 28 38 28 55 0-17 28-21 28-55" />
      <path d="M22 120c0-34 28-38 28-55 0 17 28 21 28 55" />
    </g>
    <rect class="sand top" x="24" y="12" width="52" height="48" clip-path="url(#topClip)" />
    <rect class="sand bottom" x="24" y="70" width="52" height="48" clip-path="url(#bottomClip)" />
    <circle class="grain" cx="50" cy="63" r="2.2" />
    <circle class="grain g2" cx="50" cy="63" r="1.8" />
    <circle class="grain g3" cx="50" cy="63" r="2.4" />
  </g>
</svg>
